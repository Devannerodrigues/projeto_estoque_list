<div class="form-container">

    <div class="cabecalho">
  
      <div>
  
        <h1>
          {{ editando ? 'Alterar Produto' : 'Adicionar Produto' }}
        </h1>
  
        <p>
          {{ editando
            ? 'Altere os dados do produto'
            : 'Cadastre um novo produto no estoque'
          }}
        </p>
  
      </div>
  
      <a
        routerLink="/estoque"
        class="btn-voltar">
  
        Voltar para estoque
  
      </a>
  
    </div>
  
  
    @if (mensagem) {
  
      <div class="mensagem sucesso">
        {{ mensagem }}
      </div>
  
    }
  
  
    @if (erro) {
  
      <div class="mensagem erro">
        {{ erro }}
      </div>
  
    }
  
  
    <form
      #formulario="ngForm"
      (ngSubmit)="salvar()">
  
  
      <div class="campo">
  
        <label for="produto">
          Produto
        </label>
  
        <input
          id="produto"
          type="text"
          name="produto"
          [(ngModel)]="produto.produto"
          placeholder="Digite o nome do produto"
          maxlength="20"
          required>
  
      </div>
  
  
      <div class="campo">
  
        <label for="descricao">
          Descrição
        </label>
  
        <textarea
          id="descricao"
          name="descricao_produto"
          [(ngModel)]="produto.descricao_produto"
          placeholder="Digite a descrição do produto"
          required>
        </textarea>
  
      </div>
  
  
      <div class="linha">
  
  
        <div class="campo">
  
          <label for="setor">
            ID do setor
          </label>
  
          <input
            id="setor"
            type="number"
            name="idsetor"
            [(ngModel)]="produto.idsetor"
            min="1"
            required>
  
        </div>
  
  
        <div class="campo">
  
          <label for="valor">
            Valor unitário
          </label>
  
          <input
            id="valor"
            type="number"
            name="valor_unitario"
            [(ngModel)]="produto.valor_unitario"
            min="0"
            step="0.01"
            required>
  
        </div>
  
  
      </div>
  
  
      <div class="linha">
  
  
        <div class="campo">
  
          <label for="unidade">
            Unidade
          </label>
  
          <input
            id="unidade"
            type="text"
            name="unidade"
            [(ngModel)]="produto.unidade"
            placeholder="Ex: UN, PAR, KG"
            maxlength="20"
            required>
  
        </div>
  
  
        <div class="campo">
  
          <label for="estoque">
            Quantidade em estoque
          </label>
  
          <input
            id="estoque"
            type="number"
            name="estoque"
            [(ngModel)]="produto.estoque"
            min="0"
            required>
  
        </div>
  
  
      </div>
  
  
      <div class="botoes">
  
        <button
          type="button"
          class="btn-cancelar"
          (click)="voltar()">
  
          Cancelar
  
        </button>
  
  
        <button
          type="submit"
          class="btn-salvar">
  
          {{ editando
            ? 'Salvar alteração'
            : 'Adicionar produto'
          }}
  
        </button>
  
      </div>
  
  
    </form>
  
  </div>
